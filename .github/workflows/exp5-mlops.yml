name: Exp5 MLOps CI/CD

on:
  push:
    branches: [main, "feature/exp5-**"]
    paths: ["Experiment_5_End_to_End_MLOps/**", ".github/workflows/exp5-mlops.yml"]
  pull_request:
    branches: [main]
    paths: ["Experiment_5_End_to_End_MLOps/**", ".github/workflows/exp5-mlops.yml"]

defaults:
  run:
    working-directory: Experiment_5_End_to_End_MLOps

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Experiment_5_End_to_End_MLOps/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub (not on PRs)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: Experiment_5_End_to_End_MLOps
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/iris-mlops:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/iris-mlops:${{ github.sha }}

